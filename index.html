<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Card Drop Shooter - Bắn Rơi Thẻ Bài</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for modern arcade look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="game-container">
        <!-- Top HUD -->
        <header id="hud">
            <div class="hud-item">
                <span class="label">MÀN</span>
                <span id="level-val" class="value highlight">1</span>
            </div>
            <div class="hud-item">
                <span class="label">ĐIỂM</span>
                <span id="score-val" class="value">0</span>
            </div>
            <div class="hud-item">
                <span class="label">KỶ LỤC</span>
                <span id="highscore-val" class="value" style="color:#38bdf8;">0</span>
            </div>
            <div class="hud-item">
                <span class="label">THẺ</span>
                <span id="cards-left" class="value highlight">4 / 4</span>
            </div>
            <button id="sound-btn" class="icon-btn" aria-label="Toggle Sound" title="Bật/Tắt Âm Thanh">
                <svg id="sound-on-icon" viewBox="0 0 24 24" width="22" height="22">
                    <path fill="currentColor" d="M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77zm-2.5 0L6.5 7.73H3v8.54h3.5l5 4.5V3.23zM16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.26 2.5-4.02z"/>
                </svg>
                <svg id="sound-off-icon" viewBox="0 0 24 24" width="22" height="22" style="display:none;">
                    <path fill="currentColor" d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27l4.73 4.73H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
                </svg>
            </button>
        </header>

        <!-- Main Canvas -->
        <canvas id="gameCanvas"></canvas>

        <!-- Touch Aim Hint (shown at start) -->
        <div id="aim-guide" class="aim-hint">
            <div class="finger-animation"></div>
            <span>Chạm & Kéo để ngắm dây • Thả ra để BẮN!</span>
        </div>

        <!-- Victory Modal / Overlay -->
        <div id="victory-modal" class="modal-overlay hidden">
            <div class="modal-card">
                <div class="badge"> HOÀN THÀNH</div>
                <h2>EZ GAME!</h2>
                <div class="stats-grid">
                    <div class="stat-box">
                        <span class="stat-lbl">Tổng điểm</span>
                        <span id="final-score" class="stat-num">0</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-lbl">Số đạn bắn</span>
                        <span id="final-shots" class="stat-num">0</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-lbl">Độ chuẩn xác</span>
                        <span id="final-accuracy" class="stat-num">100%</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-lbl">Thời gian</span>
                        <span id="final-time" class="stat-num">0s</span>
                    </div>
                </div>
                <div class="modal-actions">
                    <button id="open-wish-btn" class="wish-btn hidden">push it</button>
                    <button id="next-level-btn" class="primary-btn">Màn tiếp</button>
                    <button id="replay-btn" class="secondary-btn">Chơi Lại Từ Đầu</button>
                </div>
            </div>
        </div>

        <!-- Birthday Surprise Modal (Phương án A) -->
        <div id="birthday-modal" class="modal-overlay hidden">
            <div id="bday-decorations" class="bday-decorations"></div>

            <!-- Step 1: Interactive 3D Gift Box -->
            <div id="bday-gift-step" class="bday-step">
                <div class="bday-gift-wrapper" id="gift-box-click">
                    <div class="gift-box-glow"></div>
                    <div class="gift-box">
                        <div class="gift-lid">
                            <div class="gift-bow"></div>
                            <div class="gift-ribbon-lid"></div>
                        </div>
                        <div class="gift-body">
                            <div class="gift-ribbon-v"></div>
                            <div class="gift-ribbon-h"></div>
                        </div>
                    </div>
                    <div class="gift-prompt">
                        
                        <span class="prompt-text">push it!</span>
                        
                    </div>
                </div>
            </div>

            <!-- Step 2: The Birthday Card & Wish -->
            <div id="bday-card-step" class="bday-step hidden">
                <div class="bday-card-container">
                    <div class="bday-card-header">
                        <div class="bday-avatar-wrapper">
                            <img id="bday-avatar-img" src="assets/card1.jpg" alt="Avatar" class="bday-avatar">
                            <div class="bday-crown">👑</div>
                        </div>
                        <span class="bday-tag">HAPPY BIRTHDAY!</span>
                        <h2 id="bday-recipient" class="bday-name">Bạn Tuyệt Vời 💖</h2>
                    </div>

                    <!-- Typewriter Message Body -->
                    <div class="bday-message-box">
                        <p id="bday-wish-text" class="bday-wish-text"></p>
                        <span id="bday-cursor" class="bday-cursor">|</span>
                    </div>

                    <!-- Interactive Cake & Candle -->
                    <!-- <div class="bday-cake-box">
                        <div class="cake-graphic">
                            <div class="candle" id="birthday-candle">
                                <div class="candle-flame" id="candle-flame"></div>
                            </div>
                            <div class="cake-frosting"></div>
                            <div class="cake-body"></div>
                        </div>
                        <button id="blow-candle-btn" class="blow-btn">🎂 Thổi Nến Ước Nguyện</button>
                        <div id="wish-granted-msg" class="wish-granted hidden">✨ Điều ước đã bay lên trời! Chúc mọi ước mơ thành hiện thực! ✨</div>
                    </div> -->

                    <!-- Modal Actions -->
                    <!-- <div class="bday-actions">
                        <button id="close-bday-btn" class="primary-btn bday-continue-btn">🎯 Tiếp Tục Bắn Thẻ</button>
                        <button id="replay-wish-btn" class="secondary-btn">💌 Xem Lại Lời Chúc</button>
                    </div> -->
                </div>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
